<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <!-- Purple to Pink gradient -->
    <linearGradient id="maskGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <!-- Orange accent gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <!-- Background blob -->
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Subtle glow behind masks -->
  <ellipse cx="145" cy="55" rx="80" ry="50" fill="url(#glowGradient)"/>

  <!-- LEFT MASK - Laughing hysterically -->
  <g transform="translate(80, 20)">
    <!-- Mask base -->
    <path d="M0 35 Q0 0 35 0 Q70 0 70 35 Q70 55 55 65 Q35 75 15 65 Q0 55 0 35Z"
          fill="url(#maskGradient)" stroke="#5b21b6" stroke-width="2"/>
    <!-- Left eye - squeezed shut from laughing -->
    <path d="M15 28 Q22 22 29 28" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Right eye - squeezed shut from laughing -->
    <path d="M41 28 Q48 22 55 28" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Huge laughing mouth -->
    <path d="M15 45 Q35 65 55 45 Q35 55 15 45Z" fill="#fff"/>
    <!-- Tear of joy -->
    <ellipse cx="12" cy="35" rx="3" ry="4" fill="#60a5fa" opacity="0.8"/>
    <!-- Eyebrows raised in laughter -->
    <path d="M12 20 Q22 14 32 20" stroke="#5b21b6" stroke-width="2" fill="none"/>
    <path d="M38 20 Q48 14 58 20" stroke="#5b21b6" stroke-width="2" fill="none"/>
  </g>

  <!-- RIGHT MASK - Winking knowingly -->
  <g transform="translate(160, 20)">
    <!-- Mask base -->
    <path d="M0 35 Q0 0 35 0 Q70 0 70 35 Q70 55 55 65 Q35 75 15 65 Q0 55 0 35Z"
          fill="url(#maskGradient)" stroke="#5b21b6" stroke-width="2"/>
    <!-- Left eye - open -->
    <ellipse cx="22" cy="28" rx="8" ry="6" fill="#fff"/>
    <ellipse cx="22" cy="28" rx="4" ry="4" fill="#1f2937"/>
    <ellipse cx="20" cy="26" rx="1.5" ry="1.5" fill="#fff"/>
    <!-- Right eye - WINKING -->
    <path d="M41 28 Q48 24 55 28" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Smirky smile -->
    <path d="M18 48 Q35 58 52 45" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Raised eyebrow on winking side -->
    <path d="M38 16 Q50 12 58 18" stroke="#5b21b6" stroke-width="2.5" fill="none"/>
    <!-- Normal eyebrow -->
    <path d="M12 20 Q22 17 32 20" stroke="#5b21b6" stroke-width="2" fill="none"/>
  </g>

  <!-- PARODY EVERYTHING text -->
  <text x="200" y="115" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#1f2937" letter-spacing="1">
    PARODY
    <tspan fill="url(#maskGradient)">EVERYTHING</tspan>
  </text>

  <!-- Meta tagline -->
  <text x="200" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" font-style="italic">
    "Yes, even this logo is a parody"
  </text>

  <!-- Decorative sparkles -->
  <g fill="url(#accentGradient)" opacity="0.7">
    <polygon points="255,25 257,30 262,30 258,34 260,39 255,36 250,39 252,34 248,30 253,30" transform="scale(0.6)"/>
    <polygon points="320,60 322,65 327,65 323,69 325,74 320,71 315,74 317,69 313,65 318,65" transform="scale(0.5)"/>
  </g>

  <!-- Subtle URL -->
  <text x="200" y="165" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#9ca3af">
    parodyhumor.lol
  </text>
</svg>